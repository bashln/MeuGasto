name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag in vX.Y.Z.W format'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Validate release tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag must match vX.Y.Z.W"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Validate tag matches app version
        run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"

      - name: Security and privacy guardrails
        run: bash scripts/privacy-check.sh

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package-lock.json', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@7c5672355aaa8fde5f97a91aa9a99616d1ace6bc # v2

      - name: Cache Android SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('mobile/app.json') }}

      - name: Create .env file
        working-directory: ./mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env

      - name: Install dependencies
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm ci

      - name: Dependency vulnerability audit
        working-directory: ./mobile
        run: npm audit --audit-level=high

      - name: Lint
        working-directory: ./mobile
        run: npm run lint

      - name: Test
        working-directory: ./mobile
        run: npm test -- --runInBand

      - name: Typecheck
        working-directory: ./mobile
        run: npm run typecheck

      - name: Validate environment variables
        working-directory: ./mobile
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "❌ EXPO_PUBLIC_SUPABASE_URL is not set"
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "❌ EXPO_PUBLIC_SUPABASE_ANON_KEY is not set"
            exit 1
          fi
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://*)
              ;;
            *)
              echo "❌ EXPO_PUBLIC_SUPABASE_URL must start with https://"
              exit 1
              ;;
          esac
          URL_HOST="${EXPO_PUBLIC_SUPABASE_URL#https://}"
          URL_HOST="${URL_HOST%%/*}"
          if [ -z "$URL_HOST" ] || [[ "$URL_HOST" != *.* ]]; then
            echo "❌ EXPO_PUBLIC_SUPABASE_URL must include a valid host"
            exit 1
          fi
          echo "✅ Environment variables are configured"

      - name: Generate native project
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_FILE: meugasto-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx expo prebuild --clean --platform android

      - name: Decode keystore
        working-directory: ./mobile/android
        run: python3 -c "import base64,os,re; d=re.sub(r'[^A-Za-z0-9+/=]','',os.environ['ANDROID_KEYSTORE_BASE64']); open('app/meugasto-release.jks','wb').write(base64.b64decode(d))"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Android APK
        working-directory: ./mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Validate APK size
        run: |
          APK_SIZE=$(stat -c%s mobile/android/app/build/outputs/apk/release/app-release.apk)
          MIN_SIZE=40000000
          if [ $APK_SIZE -lt $MIN_SIZE ]; then
            echo "⚠️ APK muito pequeno ($APK_SIZE bytes). Possível problema no build."
            exit 1
          fi
          echo "✓ APK size: $APK_SIZE bytes"

      - name: Prepare release asset
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "mobile/android/app/build/outputs/apk/release/meugastov${VERSION_NAME}.apk"

      - name: Create Release
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          ASSET_PATH="mobile/android/app/build/outputs/apk/release/meugastov${VERSION_NAME}.apk"
          TAG_NAME="$RELEASE_TAG"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists — uploading asset"
            gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber
          else
            echo "Creating release $TAG_NAME with asset"
            gh release create "$TAG_NAME" --generate-notes "$ASSET_PATH"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
