name: Quality

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Security and privacy guardrails
        run: bash scripts/privacy-check.sh

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Repository hygiene guard
        run: bash scripts/repo-hygiene-check.sh

      - name: Repository hygiene guard tests
        run: bash scripts/repo-hygiene-check.test.sh

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        working-directory: ./mobile
        run: npm ci

      - name: Dependency audit policy tests
        run: node --test scripts/dependency-audit.test.mjs

      - name: Dependency vulnerability audit
        run: node scripts/dependency-audit.mjs

      - name: Pull request size advisory
        if: github.event_name == 'pull_request'
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: bash scripts/check-pr-size.sh "$CHANGED_FILES" "$ADDITIONS" "$DELETIONS"

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Native Android Unit Tests
        working-directory: ./mobile
        run: ./gradlew test

      - name: Compile instrumented tests
        working-directory: ./mobile
        run: ./gradlew assembleDebugAndroidTest
